[package]
name = "arkmd"
version = "0.31.2"
description = "Lightweight Markdown viewer and editor"
edition = "2021"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows; staticlib/cdylib are for iOS/Android targets.
name = "arkmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Remembers file access granted through dialogs across restarts (desktop only; iOS will use security-scoped bookmarks).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-persisted-scope = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Reads a picture from the clipboard when the web view can't (Paste in the editor on Linux).
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
png = "0.18"
