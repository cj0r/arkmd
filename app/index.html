<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ArkMD</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <header id="bar" data-tauri-drag-region>
    <button class="icon" id="btn-files" title="Recent files (Ctrl+Shift+R)" aria-label="Recent files" aria-haspopup="true" aria-expanded="false" aria-controls="files"></button>
    <div id="tabs" role="group" aria-label="Open files"></div>
    <button class="icon" id="btn-add" title="New or open" aria-label="New or open file" aria-haspopup="menu"></button>
    <div class="spacer" data-tauri-drag-region></div>
    <button class="icon" id="btn-find" title="Find and replace (Ctrl+F)" aria-label="Find and replace" aria-haspopup="true" aria-expanded="false" aria-controls="findbar" hidden></button>
    <button class="icon" id="btn-outline" title="Outline (Ctrl+Shift+O)" aria-label="Outline" aria-haspopup="true" aria-expanded="false" aria-controls="outline" hidden></button>
    <button class="icon" id="btn-undo" title="Undo (Ctrl+Z)" aria-label="Undo" hidden disabled>
      <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
    </button>
    <button class="icon" id="btn-redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" hidden disabled>
      <svg viewBox="0 0 24 24"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg>
    </button>
    <button class="icon" id="btn-save" title="Save (Ctrl+S)" aria-label="Save" hidden>
      <svg viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
    </button>
    <button class="icon" id="btn-format" title="Formatting panel" aria-label="Formatting panel" aria-pressed="true" hidden>
      <svg viewBox="0 0 24 24"><path d="M2.5 4v3h5v12h3V7h5V4h-13zm19 5h-9v3h3v7h3v-7h3V9z"/></svg>
    </button>
    <button class="icon" id="btn-theme" title="Theme" aria-label="Theme">
      <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
    </button>
    <button class="icon" id="btn-more" title="More" aria-label="More">
      <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
    </button>
    <!-- Window controls: shown only when the platform draws no window frame (e.g. Linux). -->
    <div id="winctl" role="group" aria-label="Window controls" hidden>
      <button id="win-min" title="Minimize" aria-label="Minimize"></button>
      <button id="win-max" title="Maximize" aria-label="Maximize"></button>
      <button id="win-close" class="close" title="Close" aria-label="Close window"></button>
    </div>
  </header>

  <main id="content" aria-live="off">
    <section id="home">
      <h1 class="brand">ArkMD</h1>
      <div id="update-banner" role="status" hidden></div>
      <div class="actions">
        <button id="home-open" class="tile">Open file</button>
        <button id="home-new" class="tile">New file</button>
      </div>
      <p class="tour"><button id="home-tour" class="link">Take the welcome tour</button></p>
      <div id="pinned-head" class="recent-head" hidden><span>Pinned</span></div>
      <ul id="pinned" aria-label="Pinned files"></ul>
      <div class="recent-head"><span>Recent</span><span><button id="see-all" class="link">See all</button><button id="clear-recent" class="link">Clear</button></span></div>
      <ul id="recent" aria-label="Recent files"></ul>
      <p id="no-recent" class="muted">Open a Markdown file here, or use "Open with ArkMD" from your file manager.</p>
    </section>
    <iframe id="reader" src="/viewer.html" title="Reader" hidden></iframe>
    <div id="editor" hidden></div>
    <div id="findbar" role="search" aria-label="Find and replace" hidden>
      <div class="find-row">
        <button id="find-more" class="fbtn" aria-label="Show replace" title="Replace (Ctrl+H)" aria-expanded="false">&#9656;</button>
        <input id="find-q" type="text" placeholder="Find" aria-label="Find" autocomplete="off" autocapitalize="off" spellcheck="false">
        <span id="find-count" aria-live="polite"></span>
        <button id="find-prev" class="fbtn" aria-label="Previous match" title="Previous (Shift+Enter)">&#8593;</button>
        <button id="find-next" class="fbtn" aria-label="Next match" title="Next (Enter)">&#8595;</button>
        <button id="find-case" class="fbtn" aria-pressed="false" aria-label="Match case" title="Match case">Aa</button>
        <button id="find-word" class="fbtn" aria-pressed="false" aria-label="Whole word" title="Whole word">ab</button>
        <button id="find-regex" class="fbtn" aria-pressed="false" aria-label="Regular expression" title="Regular expression">.*</button>
        <button id="find-close" class="fbtn" aria-label="Close find" title="Close (Esc)">&#10005;</button>
      </div>
      <div class="find-row" id="find-replace-row" hidden>
        <input id="find-r" type="text" placeholder="Replace with" aria-label="Replace with" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button id="find-replace-one" class="fbtn wide">Replace</button>
        <button id="find-replace-all" class="fbtn wide">Replace all</button>
      </div>
    </div>
    <nav id="files" aria-label="Recent files" hidden>
      <div class="files-head">
        <span class="files-title">Recent files</span>
        <button id="files-open" class="fbtn wide">Open…</button>
        <button id="files-new" class="fbtn wide">New</button>
      </div>
      <div class="files-filter" role="group" aria-label="Show">
        <button id="files-all" class="pill on" aria-pressed="true">All</button>
        <button id="files-pinned" class="pill" aria-pressed="false">Pinned</button>
      </div>
      <input id="files-q" type="search" placeholder="Search recent files" aria-label="Search recent files" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div id="files-body">
        <div id="files-folders" hidden>
          <div class="folders-head">
            <span class="files-group-label">Folders</span>
            <button id="files-add-folder" class="link" aria-label="Add a folder">Add a folder</button>
          </div>
          <div id="folders-tree-wrap" hidden>
            <div id="folders-tree" role="tree" aria-label="Folders"></div>
            <div id="folders-actions"></div>
          </div>
        </div>
        <div id="files-list" role="list"></div>
      </div>
      <div class="files-foot"><button id="files-clear" class="link">Clear recent files</button></div>
    </nav>
    <nav id="outline" aria-label="Outline" hidden></nav>
    <div id="formatbar" role="toolbar" aria-label="Formatting" hidden></div>
    <button id="toggle" class="fab" title="Edit (Ctrl+E)" aria-label="Edit" hidden></button>
  </main>
  <footer id="statusbar" aria-live="off" aria-label="Document information" hidden></footer>

  <div id="menu" class="popup" role="menu" aria-label="More" hidden></div>
  <div id="dialog-backdrop" hidden><div id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"></div></div>
  <div id="drop" hidden aria-hidden="true"></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
