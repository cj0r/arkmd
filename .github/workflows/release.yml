name: Release

# Runs only in the public repo (cj0r/arkmd). A version tag (vX.Y.Z) builds the Android, Linux and Windows files and
# creates the GitHub release with them, their SHA-256 checksums and the notes from CHANGELOG.md. Run by hand
# (Run workflow) it builds everything and checks the checksums and release notes, without creating a release.
#
# The Android build is signed with the ArkMD release key, stored in the repository's secrets
# (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). The same key signs
# every release, so an update installs over the previous version.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # SHA-256 of the ArkMD release signing certificate; the build stops if the APK is signed with anything else
  ANDROID_CERT_SHA256: 1e18cf4304250b1adea255481f9f91c85a1765cf6ce4ec8a4c2f53461fd9ec90

jobs:
  test:
    if: github.repository == 'cj0r/arkmd'
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Version
        id: v
        run: |
          want="$(python3 tools/version.py)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "v$want" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME but the app's version is $want"; exit 1; }
            case "$want" in
              *-*) test -s BETA_NOTES.md || { echo "A beta needs BETA_NOTES.md"; exit 1; } ;;     # a beta (1.2.3-4) has no changelog entry
              *) grep -q "^## $want " CHANGELOG.md || { echo "CHANGELOG.md has no '## $want' section"; exit 1; } ;;
            esac
          fi
          echo "version=$want" >> "$GITHUB_OUTPUT"
      - name: Tests
        working-directory: app
        run: |
          npm ci
          npm test

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "app/src-tauri -> target"
      - name: Linux libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf build-essential libssl-dev libxdo-dev
      - name: Build
        working-directory: app
        env:
          # signs the update packages; the matching public key is in tauri.conf.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          npx tauri build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.name }}
          retention-days: 3
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/rpm/*.rpm
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/*/*.sig

  # Experimental: an unsigned, untested macOS build (Intel and Apple Silicon in one app). The release does not wait for
  # it and does not fail if it fails; it is attached to the release only when it succeeded.
  macos:
    needs: test
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "app/src-tauri -> target"
      - name: Build
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # "-" signs the app ad hoc, which Apple Silicon requires to run it at all; it is not an Apple Developer ID signature
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          npm ci
          npx tauri build --target universal-apple-darwin --bundles dmg
      - name: Name the file
        run: |
          version="$(python3 tools/version.py)"
          dmg="$(ls app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)"
          mkdir -p out && cp "$dmg" "out/ArkMD-$version-macos-universal-experimental.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          retention-days: 3
          if-no-files-found: error
          path: out/*.dmg

  # Installs the Windows installer that was just built, opens a file with it, and checks that the window shows that file,
  # that a second launch adds its file to the same window, and that the uninstaller runs. Also runs the Rust tests on
  # Windows (paths, rename). A screenshot is kept as an artifact for 3 days.
  windows-check:
    needs: desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "app/src-tauri -> target"
      - name: Rust tests
        working-directory: app
        shell: pwsh
        run: |
          npm ci
          npx vite build
          cargo test --manifest-path src-tauri/Cargo.toml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-windows
          path: installers
      - name: Install, open files, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Shot($name) {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$env:RUNNER_TEMP\$name.png")
          }
          function WaitTitle($proc, $text, $seconds) {
            for ($i = 0; $i -lt $seconds; $i++) {
              $proc.Refresh()
              if ($proc.HasExited) { throw "ArkMD exited (code $($proc.ExitCode))" }
              if ($proc.MainWindowTitle -like "*$text*") { return }
              Start-Sleep -Seconds 1
            }
            throw "The window never showed '$text' (title: '$($proc.MainWindowTitle)')"
          }
          $setup = (Get-ChildItem installers -Recurse -Filter *-setup.exe | Select-Object -First 1).FullName
          Write-Host "Installing $setup"
          Start-Process $setup -ArgumentList "/S" -Wait
          $dir = Get-ChildItem "$env:LOCALAPPDATA" -Directory -Filter "ArkMD*" | Select-Object -First 1
          if (-not $dir) { $dir = Get-ChildItem "$env:ProgramFiles" -Directory -Filter "ArkMD*" | Select-Object -First 1 }
          if (-not $dir) { throw "The installer put no ArkMD folder under LocalAppData or Program Files" }
          $exe = Get-ChildItem $dir.FullName -Filter "*.exe" | Where-Object { $_.Name -notmatch "unins" } | Select-Object -First 1
          Write-Host "Installed to $($dir.FullName); starting $($exe.Name)"
          $one = Join-Path $env:RUNNER_TEMP "smoke one.md"
          $two = Join-Path $env:RUNNER_TEMP "smoke-two.md"
          Set-Content -Path $one -Value "# Smoke one`n`nHello" -Encoding UTF8
          Set-Content -Path $two -Value "# Smoke two`n`nHello" -Encoding UTF8
          $app = Start-Process $exe.FullName -ArgumentList "`"$one`"" -PassThru
          try {
            WaitTitle $app "smoke one.md" 60
            Start-Sleep -Seconds 3
            Shot "windows-launch"
            # the window must fit on the screen (the runner's screen is small)
            Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public struct RECT { public int L, T, R, B; } public class Win { [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r); }'
            $app.Refresh()
            $rect = New-Object RECT
            [void][Win]::GetWindowRect($app.MainWindowHandle, [ref]$rect)
            $area = [System.Windows.Forms.SystemInformation]::WorkingArea
            Write-Host "Window $($rect.L),$($rect.T) to $($rect.R),$($rect.B); work area $($area.Left),$($area.Top) to $($area.Right),$($area.Bottom)"
            if ($rect.B -gt $area.Bottom + 12 -or $rect.R -gt $area.Right + 12) { throw "The window does not fit on the screen" }
            Start-Process $exe.FullName -ArgumentList "`"$two`""    # a second launch hands its file to the running window
            WaitTitle $app "smoke-two.md" 30
            Shot "windows-second-launch"
          } finally {
            Get-Process | Where-Object { $_.Name -like "arkmd*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          $un = Get-ChildItem $dir.FullName -Filter "uninstall*.exe" | Select-Object -First 1
          if (-not $un) { throw "No uninstaller was installed" }
          Start-Process $un.FullName -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 3
          if (Get-ChildItem $dir.FullName -Filter "*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.Name -notmatch "unins" }) { throw "The uninstaller left the program behind" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: check-windows-screenshots
          retention-days: 3
          if-no-files-found: ignore
          path: ${{ runner.temp }}/windows-*.png

  android:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "app/src-tauri -> target"
      - name: Android SDK packages
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses > /dev/null || true
          "$sdk" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "The Android signing secrets are not set"; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/arkmd.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/arkmd.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$RUNNER_TEMP/keystore.properties"
          echo "ARKMD_KEYSTORE_PROPS=$RUNNER_TEMP/keystore.properties" >> "$GITHUB_ENV"
      - name: Build the APK
        working-directory: app
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm ci
          npx tauri android build --apk --split-per-abi --target aarch64 --ci
      - name: Check the signature and name the file
        run: |
          apk="$(ls app/src-tauri/gen/android/app/build/outputs/apk/arm64/release/*.apk)"
          got="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
          test "$got" = "$ANDROID_CERT_SHA256" || { echo "The APK is signed with an unexpected certificate ($got)"; exit 1; }
          version="$(python3 tools/version.py)"
          mkdir -p out && cp "$apk" "out/ArkMD-$version-android-arm64.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          retention-days: 3
          if-no-files-found: error
          path: out/*.apk

  release:
    needs: [test, desktop, android, macos, windows-check]
    # the experimental macOS build may fail without stopping the release
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.desktop.result == 'success' && needs.android.result == 'success' && needs['windows-check'].result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write     # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: files
          pattern: "{desktop-*,android,macos}"      # not the check screenshots
          merge-multiple: true
      - name: Checksums and release notes
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          # each platform's files arrive in their own folders: put them side by side
          find files -mindepth 2 -type f -exec mv -t files {} +
          find files -mindepth 1 -type d -empty -delete
          case "$VERSION" in
            *-*) cp BETA_NOTES.md notes.md ;;     # a beta: the notes written when it was published
            *) awk -v v="$VERSION" '$0 ~ "^## "v" " || $0 == "## "v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md ;;
          esac
          test -s notes.md || { echo "No release notes for $VERSION"; exit 1; }
          # latest.json (Windows and Linux) and android.json (Android) tell the in-app updater what is current
          python3 tools/make_update_manifest.py --files files --version "$VERSION" --notes notes.md --repo "$GITHUB_REPOSITORY"
          (cd files && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # 6 packages, 2 manifests, the checksums and at least the AppImage and Windows installer signatures
          test "$(ls files | wc -l)" -ge 11 || { echo "Too few release files:"; ls files; exit 1; }
      # a manual run stops here; only a version tag publishes
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: ArkMD ${{ needs.test.outputs.version }}${{ contains(needs.test.outputs.version, '-') && ' (beta)' || '' }}
          body_path: notes.md
          files: files/*
          prerelease: ${{ contains(needs.test.outputs.version, '-') }}
          make_latest: ${{ !contains(needs.test.outputs.version, '-') }}
      # The in-app updater's "Include beta versions" reads the manifests of the rolling "beta" release. They always
      # describe the newest build, beta or final, so a beta tester also gets the final release when it ships.
      - name: Point the beta channel at this release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view beta >/dev/null 2>&1 || gh release create beta --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Beta channel" --notes "Update manifests for the in-app Include beta versions setting. There is nothing to download here: the builds are in the releases above."
          gh release upload beta files/latest.json files/android.json --clobber
