<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document</title>
<style id="fontface"></style>
<style>
@font-face { font-family: ArkMono; src: url('fonts/jetbrainsmono/regular.ttf'); font-weight: 400; font-style: normal; }
@font-face { font-family: ArkMono; src: url('fonts/jetbrainsmono/bold.ttf'); font-weight: 700; font-style: normal; }
:root {
  --bg:#1a1b26; --bg-alt:#16161e; --surface:#292e42; --fg:#c0caf5; --fg-muted:#565f89;
  --accent:#7aa2f7; --link:#7aa2f7; --selection:#283457;
  --h1:#f7768e; --h2:#ff9e64; --h3:#e0af68; --h4:#9ece6a; --h5:#7dcfff; --h6:#bb9af7;
  --bold:#ff9e64; --italic:#bb9af7; --code-fg:#9ece6a; --quote-border:#7aa2f7; --checkbox:#7aa2f7; --tag:#7dcfff;
  --hl-keyword:#bb9af7; --hl-string:#9ece6a; --hl-number:#ff9e64; --hl-comment:#565f89; --hl-function:#7aa2f7;
  --hl-title:#7aa2f7; --hl-type:#2ac3de; --hl-variable:#c0caf5; --hl-attr:#73daca; --hl-builtin:#2ac3de;
  --hl-literal:#ff9e64; --hl-meta:#7dcfff; --hl-operator:#89ddff; --hl-punctuation:#a9b1d6; --hl-regexp:#b4f9f8;
  --hl-deletion:#f7768e; --hl-addition:#9ece6a;
  --red:#f7768e; --orange:#ff9e64; --yellow:#e0af68; --green:#9ece6a; --cyan:#7dcfff; --purple:#bb9af7;
  --font-size:16px;
  --font-body: system-ui, Roboto, sans-serif;
  --font-mono: ArkMono, "Roboto Mono", ui-monospace, monospace;
  /* Readable secondary text: theme comment colours are too faint for prose. */
  --fg-soft: color-mix(in srgb, var(--fg) 68%, var(--bg));
}
* { box-sizing:border-box; }
html, body { margin:0; padding:0; background:var(--bg); color:var(--fg); }
body {
  font-size: var(--font-size); line-height: 1.65; font-family: var(--font-body);
  padding: 12px 18px 96px; word-wrap: break-word; overflow-wrap: anywhere;
  -webkit-tap-highlight-color: transparent;
}
::selection { background: var(--selection); }
#doc { max-width: 760px; margin: 0 auto; }
h1,h2,h3,h4,h5,h6 { line-height:1.3; margin:1.3em 0 .5em; font-weight:700; }
h1 { color:var(--h1); font-size:1.85em; }
h2 { color:var(--h2); font-size:1.55em; }
h3 { color:var(--h3); font-size:1.3em; }
h4 { color:var(--h4); font-size:1.15em; }
h5 { color:var(--h5); font-size:1.05em; }
h6 { color:var(--h6); font-size:1em; }
#doc > :first-child { margin-top:.3em; }
p { margin:.7em 0; }
strong { color:var(--bold); }
em { color:var(--italic); }
a { color:var(--link); text-decoration:underline; text-decoration-color: color-mix(in srgb, var(--link) 40%, transparent); }
hr { border:0; border-top:1px solid var(--surface); margin:1.8em 0; }
mark { background: color-mix(in srgb, var(--yellow) 35%, transparent); color: inherit; border-radius:3px; padding:0 2px; }
code {
  font-family: var(--font-mono); font-size:.88em;
  color:var(--code-fg); background:var(--bg-alt); padding:.12em .38em; border-radius:4px;
}
pre { background:var(--bg-alt); border:1px solid var(--surface); border-radius:8px; padding:12px 14px; overflow-x:auto; position:relative; }
pre code { background:none; padding:0; color:var(--fg); font-size:.84em; line-height:1.55; }
pre[data-lang] { padding-top:24px; }
pre[data-lang]::after {
  content: attr(data-lang); position:absolute; top:4px; right:10px; font-size:.7em; color:var(--fg-muted);
  font-family: ui-monospace, monospace; text-transform: lowercase;
}
blockquote { margin:1em 0; padding:.2em 1em; border-left:3px solid var(--quote-border); color:var(--fg-soft); }
blockquote > :first-child { margin-top:.4em; } blockquote > :last-child { margin-bottom:.4em; }
ul, ol { padding-left:1.6em; margin:.6em 0; }
li { margin:.2em 0; }
li::marker { color: var(--accent); }
ul.contains-task-list { list-style:none; padding-left:.4em; }
li.task-list-item { position:relative; }
li.task-list-item input[type=checkbox] {
  appearance:none; -webkit-appearance:none; width:1.05em; height:1.05em; margin:0 .5em -.15em 0;
  border:1.5px solid var(--checkbox); border-radius:4px; vertical-align:baseline; position:relative;
}
li.task-list-item input[type=checkbox]:checked { background:var(--checkbox); }
li.task-list-item input[type=checkbox]:checked::after {
  content:""; position:absolute; left:.3em; top:.08em; width:.25em; height:.55em;
  border:solid var(--bg); border-width:0 2px 2px 0; transform:rotate(45deg);
}
li.task-done { color:var(--fg-soft); text-decoration:line-through; }
table { border-collapse:collapse; margin:1em 0; display:block; overflow-x:auto; max-width:100%; }
th, td { border:1px solid var(--surface); padding:.4em .75em; overflow-wrap:normal; word-break:normal; }
th { white-space:nowrap; }
th { background:var(--bg-alt); color:var(--accent); text-align:left; }
img { max-width:100%; border-radius:6px; }
.tag {
  color:var(--tag); background: color-mix(in srgb, var(--tag) 14%, transparent);
  border-radius:999px; padding:.05em .55em; font-size:.9em; white-space:nowrap;
}
.wikilink { color:var(--accent); border-bottom:1px dashed var(--accent); }
.footnotes { font-size:.9em; color:var(--fg-soft); }
.footnotes-sep { border-top:1px solid var(--surface); }
/* Obsidian-style callouts */
.callout { --c: var(--accent); border-left:3px solid var(--c); background: color-mix(in srgb, var(--c) 10%, transparent);
  border-radius:6px; padding:.5em 1em; margin:1em 0; color:var(--fg); }
.callout-title { color:var(--c); font-weight:700; display:flex; gap:.45em; align-items:center; }
.callout-title::before { content: attr(data-icon); }
.callout-body > :first-child { margin-top:.35em; } .callout-body > :last-child { margin-bottom:.2em; }
.callout[data-type=tip], .callout[data-type=hint], .callout[data-type=important], .callout[data-type=success], .callout[data-type=done], .callout[data-type=check] { --c: var(--green); }
.callout[data-type=warning], .callout[data-type=caution], .callout[data-type=attention] { --c: var(--orange); }
.callout[data-type=danger], .callout[data-type=error], .callout[data-type=bug], .callout[data-type=failure], .callout[data-type=fail], .callout[data-type=missing] { --c: var(--red); }
.callout[data-type=question], .callout[data-type=faq], .callout[data-type=help] { --c: var(--yellow); }
.callout[data-type=quote], .callout[data-type=cite] { --c: var(--fg-soft); }
.callout[data-type=example] { --c: var(--purple); }
.callout[data-type=info], .callout[data-type=todo] { --c: var(--cyan); }
.frontmatter { font-family: var(--font-mono); font-size:.8em; color:var(--fg-soft); background:var(--bg-alt);
  border:1px solid var(--surface); border-radius:8px; padding:8px 12px; white-space:pre-wrap; margin-bottom:1em; }
.empty { color:var(--fg-muted); text-align:center; margin-top:30vh; }
/* highlight.js tokens */
.hljs-keyword,.hljs-selector-tag,.hljs-doctag { color:var(--hl-keyword); }
.hljs-string,.hljs-template-tag,.hljs-selector-attr { color:var(--hl-string); }
.hljs-number { color:var(--hl-number); }
.hljs-comment,.hljs-quote { color:var(--hl-comment); font-style:italic; }
.hljs-title.function_,.hljs-function { color:var(--hl-function); }
.hljs-title,.hljs-section,.hljs-selector-id,.hljs-selector-class { color:var(--hl-title); }
.hljs-type,.hljs-title.class_ { color:var(--hl-type); }
.hljs-variable,.hljs-template-variable,.hljs-params { color:var(--hl-variable); }
.hljs-attr,.hljs-attribute,.hljs-property { color:var(--hl-attr); }
.hljs-built_in,.hljs-name,.hljs-tag { color:var(--hl-builtin); }
.hljs-literal,.hljs-symbol,.hljs-bullet { color:var(--hl-literal); }
.hljs-meta,.hljs-link { color:var(--hl-meta); }
.hljs-operator { color:var(--hl-operator); }
.hljs-punctuation { color:var(--hl-punctuation); }
.hljs-regexp { color:var(--hl-regexp); }
.hljs-deletion { color:var(--hl-deletion); }
.hljs-addition { color:var(--hl-addition); }
.hljs-emphasis { font-style:italic; } .hljs-strong { font-weight:bold; }
</style>
<script src="markdown-it.min.js"></script>
<script src="markdown-it-task-lists.min.js"></script>
<script src="markdown-it-footnote.min.js"></script>
<script src="highlight.min.js"></script>
</head>
<body>
<div id="doc"><p class="empty">Loading…</p></div>
<script>
(function () {
  function esc(s) { return s.replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  var md = window.markdownit({
    html: false, linkify: true, typographer: true, breaks: false,
    highlight: function (code, lang) {
      try {
        if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang, ignoreIllegals: true }).value;
        if (!lang && code.length < 20000) return hljs.highlightAuto(code).value;
      } catch (e) {}
      return esc(code);
    }
  }).use(window.markdownitTaskLists, { enabled: false, label: false })
    .use(window.markdownitFootnote);

  // Show the fence language as a small label.
  var defaultFence = md.renderer.rules.fence;
  md.renderer.rules.fence = function (tokens, idx, opts, env, self) {
    var lang = (tokens[idx].info || "").trim().split(/\s+/)[0];
    var html = defaultFence(tokens, idx, opts, env, self);
    return lang ? html.replace(/^<pre/, '<pre data-lang="' + esc(lang) + '"') : html;
  };

  // ==highlight==, [[wikilinks]] and #tags in plain text.
  md.core.ruler.push("obsidian_inline", function (state) {
    state.tokens.forEach(function (block) {
      if (block.type !== "inline" || !block.children) return;
      var out = [];
      block.children.forEach(function (t) {
        if (t.type !== "text" || !/(==|\[\[|#)/.test(t.content)) { out.push(t); return; }
        var re = /==([^=\n]+)==|\[\[([^\]\n|]+)(?:\|([^\]\n]+))?\]\]|(^|\s)#([A-Za-z0-9_\-\/]*[A-Za-z_\-\/][A-Za-z0-9_\-\/]*)/g;
        var s = t.content, last = 0, m;
        function text(str) { if (!str) return; var x = new state.Token("text", "", 0); x.content = str; out.push(x); }
        function raw(html) { var x = new state.Token("html_inline", "", 0); x.content = html; out.push(x); }
        while ((m = re.exec(s))) {
          text(s.slice(last, m.index));
          if (m[1] !== undefined) raw("<mark>" + esc(m[1]) + "</mark>");
          else if (m[2] !== undefined) raw('<span class="wikilink">' + esc(m[3] || m[2]) + "</span>");
          else { text(m[4]); raw('<span class="tag">#' + esc(m[5]) + "</span>"); }
          last = re.lastIndex;
        }
        text(s.slice(last));
      });
      block.children = out;
    });
  });

  var ICONS = { note:"✎", abstract:"☰", summary:"☰", tldr:"☰", info:"ℹ", todo:"☐", tip:"🔥", hint:"🔥", important:"🔥",
    success:"✔", check:"✔", done:"✔", question:"?", help:"?", faq:"?", warning:"⚠", caution:"⚠", attention:"⚠",
    failure:"✖", fail:"✖", missing:"✖", danger:"⚡", error:"⚡", bug:"🐞", example:"☷", quote:"❝", cite:"❝" };

  function callouts(root) {
    root.querySelectorAll("blockquote").forEach(function (bq) {
      var p = bq.firstElementChild;
      if (!p || p.tagName !== "P") return;
      var m = /^\[!([A-Za-z-]+)\]([+-]?)[ \t]*([^\n]*)\n?/.exec(p.innerHTML);
      if (!m) return;
      var type = m[1].toLowerCase();
      var title = m[3] || (type.charAt(0).toUpperCase() + type.slice(1));
      p.innerHTML = p.innerHTML.slice(m[0].length);
      if (!p.innerHTML.trim()) p.remove();
      var box = document.createElement(m[2] ? "details" : "div");
      if (m[2] === "+") box.open = true;
      box.className = "callout"; box.dataset.type = type;
      var head = document.createElement(m[2] ? "summary" : "div");
      head.className = "callout-title"; head.dataset.icon = ICONS[type] || "✎"; head.innerHTML = title;
      var body = document.createElement("div"); body.className = "callout-body";
      while (bq.firstChild) body.appendChild(bq.firstChild);
      box.appendChild(head); box.appendChild(body);
      bq.replaceWith(box);
    });
  }

  window.applyTheme = function (vars) {
    var st = document.documentElement.style;
    Object.keys(vars).forEach(function (k) { st.setProperty("--" + k, vars[k]); });
  };

  window.render = function (src, scrollFraction) {
    var doc = document.getElementById("doc");
    var front = "";
    var fm = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?/.exec(src);
    if (fm) { front = '<div class="frontmatter">' + esc(fm[1]) + "</div>"; src = src.slice(fm[0].length); }
    if (!src.trim() && !front) { doc.innerHTML = '<p class="empty">Empty file</p>'; return; }
    doc.innerHTML = front + md.render(src);
    callouts(doc);
    doc.querySelectorAll("li.task-list-item input:checked").forEach(function (i) { i.parentNode.classList.add("task-done"); });
    // Accessibility: task checkboxes are named by their item text; wide tables/code blocks are keyboard-scrollable.
    doc.querySelectorAll("li.task-list-item > input").forEach(function (i) {
      i.setAttribute("aria-label", (i.parentNode.textContent || "").trim().slice(0, 120) || "Task");
    });
    doc.querySelectorAll("pre, table").forEach(function (el) {
      el.setAttribute("tabindex", "0");
      el.setAttribute("role", "region");
      el.setAttribute("aria-label", el.tagName === "PRE" ? "Code" + (el.dataset.lang ? " (" + el.dataset.lang + ")" : "") : "Table");
    });
    if (scrollFraction) {
      requestAnimationFrame(function () {
        window.scrollTo(0, scrollFraction * (document.body.scrollHeight - window.innerHeight));
      });
    }
  };

  // Reading font: dir under assets/fonts/ (null = system). kind: static | mono (no italic files) | variable.
  window.setFont = function (dir, kind) {
    var css = "";
    function face(file, weight, style) {
      css += "@font-face{font-family:ArkBody;src:url('fonts/" + dir + "/" + file + ".ttf');font-weight:" + weight + ";font-style:" + style + ";}";
    }
    if (dir && kind === "variable") { face("regular", "400 700", "normal"); face("italic", "400 700", "italic"); }
    else if (dir) {
      face("regular", 400, "normal"); face("bold", 700, "normal");
      if (kind !== "mono") { face("italic", 400, "italic"); face("bolditalic", 700, "italic"); }
    }
    document.getElementById("fontface").textContent = css;
    document.documentElement.style.setProperty("--font-body", dir ? "ArkBody, system-ui, sans-serif" : "system-ui, Roboto, sans-serif");
  };

  window.scrollFraction = function () {
    var h = document.body.scrollHeight - window.innerHeight;
    return h > 0 ? window.scrollY / h : 0;
  };

  // The headings of the rendered document, for the host's Outline flyout.
  function headingEls() { return Array.prototype.slice.call(document.querySelectorAll("#doc h1, #doc h2, #doc h3, #doc h4, #doc h5, #doc h6")); }
  window.headings = function () {
    return headingEls().map(function (h) { return { level: Number(h.tagName.charAt(1)), text: (h.textContent || "").replace(/\s+/g, " ").trim() }; });
  };
  window.scrollToHeading = function (i) {
    var h = headingEls()[i];
    if (!h) return;
    h.scrollIntoView({ block: "start" });
    h.setAttribute("tabindex", "-1");
    h.focus({ preventScroll: true });
  };
  window.currentHeading = function () {
    var at = -1;
    headingEls().forEach(function (h, i) { if (h.getBoundingClientRect().top <= 24) at = i; });
    return at;
  };

  // Embedded in the desktop app (iframe): hand links to the host so they open in the system browser.
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest("a[href]");
    if (!a || a.getAttribute("href").charAt(0) === "#") return;
    if (window.parent !== window && window.parent.arkOpenLink) { e.preventDefault(); window.parent.arkOpenLink(a.href); }
  });

  if (window.Host) Host.ready();
})();
</script>
</body>
</html>
